name: CI

# Verifică fiecare pull request înainte de merge. Fără asta, singura poartă era
# build-ul de deploy — care rulează abia după ce codul a ajuns în master, deci o
# eroare de tip nu bloca merge-ul, ci strica publicarea.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    name: Lint, typecheck, teste și build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Teste
        run: npm test

      - name: Build
        run: npm run build
