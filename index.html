<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MedBuc · admitere UMFCD 2027</title>
    <meta
      name="description"
      content="MedBuc — grile cu explicații, capitolele celor două probe și simulări cronometrate pentru admiterea la UMFCD „Carol Davila”."
    />
    <!--
      De când există o pagină publică, adresa chiar ajunge să fie trimisă între
      elevi. Fără og:, previzualizarea dintr-o conversație arată doar URL-ul.
      Nu e og:image: n-avem încă o imagine de partajare, iar una lipsă dă un
      card rupt, nu unul fără poză.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:site_name" content="MedBuc" />
    <meta property="og:title" content="MedBuc · pregătire pentru admiterea la UMFCD" />
    <meta
      property="og:description"
      content="Grile cu explicație la fiecare variantă, capitolele celor două probe și simulări cronometrate după formatul real al admiterii."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/logo-kitty.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300..800;1,400&family=Newsreader:opsz,wght@6..72,300..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so the page never flashes the wrong palette.
      // The value is written by usePersistentState, so it is JSON — '"dark"', not 'dark'.
      (function () {
        try {
          var raw = localStorage.getItem('medbuc.theme');
          var saved = null;
          if (raw !== null) {
            try {
              saved = JSON.parse(raw);
            } catch (e) {
              saved = raw; // valoare scrisă înainte de a fi serializată ca JSON
            }
          }
          var dark =
            saved === 'dark' || saved === 'light'
              ? saved === 'dark'
              : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
